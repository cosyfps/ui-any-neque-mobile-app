name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1 — Dependencies
  # Instala, cachea node_modules y valida integridad del lockfile.
  # ────────────────────────────────────────────────────────────
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Validate lockfile integrity
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json no encontrado. Commitea el lockfile."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ────────────────────────────────────────────────────────────
  # JOB 2 — Lint & Format
  # ESLint + Prettier check. Falla rápido antes de ejecutar tests.
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: dependencies

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  # ────────────────────────────────────────────────────────────
  # JOB 3 — TypeScript type-check
  # ────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: dependencies

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Type check
        run: npm run typecheck

  # ────────────────────────────────────────────────────────────
  # JOB 4 — Tests + Coverage (≥ 80%)
  # ────────────────────────────────────────────────────────────
  test:
    name: Tests (coverage >= 80%)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Verify coverage threshold
        run: |
          node -e "
            const d = require('./coverage/coverage-summary.json');
            const t = d.total;
            const pct = (t.lines.pct + t.statements.pct + t.functions.pct + t.branches.pct) / 4;
            console.log('Coverage promedio: ' + pct.toFixed(2) + '%');
            if (pct < 80) {
              console.error('FAIL: Coverage ' + pct.toFixed(2) + '% < 80% requerido');
              process.exit(1);
            }
            console.log('OK: Coverage ' + pct.toFixed(2) + '% >= 80%');
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # JOB 5 — Angular Build
  # Valida que ng build production compila sin errores.
  # No genera .apk/.ipa (eso es release con EAS Build).
  # ────────────────────────────────────────────────────────────
  build:
    name: Angular Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Build production bundle
        run: npm run build:prod

      - name: Verify build output
        run: |
          if [ ! -d dist/ ]; then
            echo "ERROR: El build no genero output en dist/"
            exit 1
          fi
          echo "OK: Build generado correctamente"
          du -sh dist/

  # ────────────────────────────────────────────────────────────
  # CI Gate — Consolida todos los jobs
  # Branch protection rules apuntan solo a este job.
  # ────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [dependencies, lint, typecheck, test, build]
    if: always()

    steps:
      - name: Verify all jobs passed
        run: |
          JOBS_STATUS="${{ join(needs.*.result, ',') }}"
          echo "Estado de jobs: $JOBS_STATUS"
          if echo "$JOBS_STATUS" | grep -qE '(failure|cancelled)'; then
            echo "FAIL: Uno o mas jobs fallaron. PR bloqueado."
            exit 1
          fi
          echo "OK: Todos los jobs pasaron. Listo para merge."
