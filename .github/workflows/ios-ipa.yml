name: iOS IPA (sin firmar)

# Genera un .ipa sin firmar para instalarlo desde Windows con Sideloadly
# (Apple ID gratuito, caduca a los 7 días). Se lanza a mano desde Actions.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      # /ios está en .gitignore: la plataforma se genera en cada corrida.
      - name: Add iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      # @capacitor/camera cierra la app si faltan estas descripciones.
      - name: Patch Info.plist
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Para registrar fotos de tu progreso'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Para elegir fotos de tu progreso'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Para guardar fotos de tu progreso'" "$PLIST"

      - name: Build app (no signing)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Neque.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Neque-ipa
          path: Neque.ipa
          retention-days: 7
